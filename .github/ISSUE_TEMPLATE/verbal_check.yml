name: Verbal Check
description: The short spoken check on a challenge, done in lab with the instructor.
title: "Challenge 6 Verbal Check"
body:
  - type: markdown
    attributes:
      value: |
        Filled in by the instructor or a technical leader during lab. The student
        answers two or three questions about their own code in the context of the
        assignment at hand. This is a check on understanding, not a presentation.

        Challenge 6 asked for four functions in `src/naive_bayes.py`: `bayes_rule`,
        `train`, `classify` and `accuracy`. Every line below is about one of them, or
        about what the car's detector printed.
  - type: input
    attributes:
      label: Student
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Understanding
      description: Tick each line the student explained correctly, in their own words. Two or three questions is enough; no line needs their code open or a remembered number.
      options:
        - label: "Bayes' rule they wrote. What it multiplies, what it divides by, and why that divisor is the probability of the evidence."
        - label: "Training they wrote. How a prior and a likelihood come from counting, and what smoothing prevents."
        - label: "Classify they wrote. Why naive Bayes multiplies one likelihood per sensor, and what assumption that needs."
        - label: "Reading the car. Why camera2 makes the detector more confident than the data supports, or which kind of mistake it trades for which."
  - type: dropdown
    attributes:
      label: Outcome
      options:
        - "Passed: explained their own work clearly"
        - "Passed with gaps: correct code, shaky explanation"
        - "Not yet: could not provide clear answers, can redo with a token use"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Notes
      description: What to follow up on, and anything worth remembering for the next challenge.
