# Automated checks for Challenge 6. Run them yourself with:
#
#     uv run gatorgrade --config gatorgrade.yml
#
# These are the same checks that run on GitHub when you push. Results are
# preliminary: the final grade is determined by the instructor.

- description: "[EU] Expected utility weights each state by its probability"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_expected_utility_weights_each_state_by_its_probability

- description: "[EU] Expected utility of merge, review and discard at 0.15"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_expected_utility_of_each_merge_action

- description: "[EU] Expected utility when the state is certain"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_expected_utility_when_the_state_is_certain

- description: "[BEST] The best action comes back with its expected utility"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_best_action_returns_the_action_and_its_value

- description: "[BEST] The best action changes with the belief"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_best_action_changes_with_the_belief

- description: "[BEST] The best action works for three states"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_best_action_works_for_three_states

- description: "[BEST] A tie goes to the action listed first"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_best_action_breaks_a_tie_by_order

- description: "[VOI] The forecast is worth 6.3 on a cloudy morning"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_value_of_information_for_the_forecast

- description: "[VOI] The tests are worth 1.608 on a rename and 1.62 on a refactor"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_value_of_information_of_the_tests

- description: "[VOI] Information that changes no action is worth 0"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_value_of_information_is_zero_when_no_result_changes_the_action

- description: "[VOI] A useless tool is worth 0"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_value_of_information_is_zero_for_a_useless_tool

- description: "[VOI] Information is never worth less than 0"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_value_of_information_is_never_negative

- description: "[VOI] A perfect tool is worth 21 on a cloudy morning"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_value_of_a_perfect_tool

- description: "[VOI] Looking ahead leaves the belief unchanged"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_value_of_information_leaves_the_belief_unchanged

- description: "[AGENT] The agent merges a typo fix without testing"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_the_agent_merges_a_typo_fix_without_testing

- description: "[AGENT] The agent runs the tests on a refactor"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_decisions.py::test_the_agent_runs_the_tests_on_a_refactor

- description: "[STYLE] Code follows the Google Python style guide"
  check: ExecuteCommand
  options:
    command: uv run ruff check src tests

- description: "[STYLE] Type annotations check out"
  check: ExecuteCommand
  options:
    command: uv run mypy src tests

- src/decisions.py:
  - description: "[STYLE] No unfinished TODO markers are left in decisions.py"
    check: MatchFileFragment
    options:
      fragment: "TODO"
      count: 0
      exact: true

- docs/summary.md:
  - description: "[REFLECTION] The reflection has no TODO markers left in it"
    check: MatchFileFragment
    options:
      fragment: "TODO"
      count: 0
      exact: true
  - description: "[REFLECTION] The reflection meets the 200 word minimum"
    check: CountFileWords
    options:
      count: 200
      exact: false
