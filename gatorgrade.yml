# Automated checks for Challenge 6. Run them yourself with:
#
#     uv run gatorgrade --config gatorgrade.yml
#
# These are the same checks that run on GitHub when you push. Results are
# preliminary: the final grade is determined by the instructor.

- description: "[BAYES] Bayes' rule gives the detector answer from class, 0.67"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_bayes_rule_gives_the_detector_answer_from_class

- description: "[BAYES] Bayes' rule works for three classes"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_bayes_rule_works_for_three_classes

- description: "[BAYES] Bayes' rule leaves the prior unchanged"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_bayes_rule_leaves_the_prior_unchanged

- description: "[TRAIN] Training counts the prior"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_train_counts_the_prior

- description: "[TRAIN] Without smoothing, likelihoods are plain shares"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_train_without_smoothing_gives_plain_shares

- description: "[TRAIN] Smoothing adds one to every count"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_train_smoothing_adds_one_to_every_count

- description: "[TRAIN] An unseen value never gets probability 0"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_train_never_gives_an_unseen_value_probability_zero

- description: "[TRAIN] Training on the car data"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_train_on_the_car_data

- description: "[CLASSIFY] With one feature, naive Bayes is Bayes' rule"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_classify_with_one_feature_is_bayes_rule

- description: "[CLASSIFY] Two detectors flag the essay: 0.97, as in class"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_classify_multiplies_the_evidence

- description: "[CLASSIFY] Classify reads the value that was observed"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_classify_reads_the_value_that_was_observed

- description: "[CLASSIFY] Classify works for three classes"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_classify_works_for_three_classes

- description: "[CLASSIFY] Every posterior adds up to 1"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_classify_adds_up_to_one

- description: "[CLASSIFY] A sensor the model never saw is skipped"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_classify_skips_a_feature_it_has_no_table_for

- description: "[CLASSIFY] Classify leaves the evidence unchanged"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_classify_leaves_the_evidence_unchanged

- description: "[CLASSIFY] Both cameras say yes on the car data: 0.977"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_classify_on_the_car_data

- description: "[ACCURACY] Accuracy on examples counted by hand"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_accuracy_on_examples_counted_by_hand

- description: "[ACCURACY] Accuracy on the test data: 0.900 and 0.935"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_naive_bayes.py::test_accuracy_on_the_test_data

- description: "[STYLE] Code follows the Google Python style guide"
  check: ExecuteCommand
  options:
    command: uv run ruff check src tests

- description: "[STYLE] Type annotations check out"
  check: ExecuteCommand
  options:
    command: uv run mypy src tests

- src/naive_bayes.py:
  - description: "[STYLE] No unfinished TODO markers are left in naive_bayes.py"
    check: MatchFileFragment
    options:
      fragment: "TODO"
      count: 0
      exact: true

- docs/summary.md:
  - description: "[REFLECTION] The reflection has no TODO markers left in it"
    check: MatchFileFragment
    options:
      fragment: "TODO"
      count: 0
      exact: true
  - description: "[REFLECTION] The reflection meets the 200 word minimum"
    check: CountFileWords
    options:
      count: 200
      exact: false
